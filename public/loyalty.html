<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2A9D8F">
  <title>Orama Café | Cliente Frecuente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/orama-pro.css">
  <link rel="stylesheet" href="/css/orama-loyalty.css">
</head>
<body class="loyalty-body">
  <div class="fx-orb-field" aria-hidden="true">
    <span class="fx-orb" style="--fx-orb-color:var(--teal);top:-12%;left:-10%;width:46vmax;height:46vmax;--fx-orb-opacity:.5;--fx-orb-duration:22s;--fx-orb-x:6vmax;--fx-orb-y:4vmax"></span>
    <span class="fx-orb" style="--fx-orb-color:var(--amber);right:-16%;bottom:-18%;width:38vmax;height:38vmax;--fx-orb-opacity:.32;--fx-orb-duration:26s;--fx-orb-x:-5vmax;--fx-orb-y:-3vmax"></span>
  </div>
  <main id="loyalty-app" class="loyalty-shell fx-tilt-shell" aria-live="polite"></main>
  <script src="/js/orama-fx.js" defer></script>
  <script src="/js/orama-loyalty.js" defer></script>
</body>
</html>
