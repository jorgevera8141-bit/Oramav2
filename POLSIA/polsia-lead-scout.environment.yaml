name: polsia-lead-scout-env
config:
  type: cloud
  networking:
    type: limited
    # No allowed_hosts, no allow_package_managers, no allow_mcp_servers.
    # bash is disabled on the agent, so the container has no need for any
    # outbound network access at all - this closes egress completely as a
    # second layer of the "never contact anybody" constraint.
    # web_search / web_fetch are unaffected: they run on Anthropic's
    # servers regardless of this setting.
